<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AquaFarm Command - Login & Sign Up</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent: #00BFA5;
  --accent-hover: #00897B;
  --accent-glow: rgba(0, 191, 165, 0.35);
  --bg: #07101e;
  --glass: rgba(10, 24, 45, 0.72);
  --glass-border: rgba(255, 255, 255, 0.12);
  --text: #E0F7FA;
  --text-dim: #80CBC4;
  --text-muted: #546E7A;
  --danger: #FF5252;
  --success: #69F0AE;
  --radius: 16px;
  --shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
}

* { margin:0; padding:0; box-sizing:border-box; }
body {
  min-height: 100vh;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  overflow-x: hidden;
}

/* Ambient animated water glow background */
.bg-glow {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: 0;
  opacity: 0.35;
}
.glow-1 { top: -100px; left: -100px; background: #004d40; }
.glow-2 { bottom: -100px; right: -100px; background: #00695c; }
.glow-3 { top: 40%; left: 50%; transform: translate(-50%, -50%); background: #00838f; width: 350px; height: 350px; }

/* Frosted glass container */
.auth-card {
  position: relative;
  z-index: 10;
  width: 100%;
  max-width: 440px;
  background: var(--glass);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 36px 32px;
  transition: all 0.3s ease;
}

/* Brand header */
.brand {
  text-align: center;
  margin-bottom: 24px;
}
.brand-logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: linear-gradient(135deg, rgba(0, 191, 165, 0.2), rgba(0, 137, 123, 0.4));
  border: 1px solid var(--accent);
  box-shadow: 0 0 20px var(--accent-glow);
  margin-bottom: 12px;
  font-size: 26px;
}
.brand h1 {
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: #fff;
}
.brand p {
  font-size: 13px;
  color: var(--text-dim);
  margin-top: 4px;
}

/* Tabs switcher */
.tabs {
  display: flex;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 24px;
  border: 1px solid rgba(255, 255, 255, 0.05);
}
.tab-btn {
  flex: 1;
  background: transparent;
  border: none;
  border-radius: 8px;
  padding: 9px;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s ease;
}
.tab-btn.active {
  background: var(--accent);
  color: #04201d;
  box-shadow: 0 2px 10px var(--accent-glow);
}

/* Form inputs */
.form-group {
  margin-bottom: 16px;
}
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 6px;
}
.input-wrap {
  position: relative;
}
.input-wrap input, .input-wrap select {
  width: 100%;
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 11px 14px 11px 38px;
  color: #fff;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  font-family: inherit;
}
.input-wrap input:focus, .input-wrap select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--accent-glow);
}
.input-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  color: var(--text-dim);
  pointer-events: none;
}

/* Password toggle */
.pwd-toggle {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--text-dim);
  cursor: pointer;
  font-size: 14px;
}

/* Submit & OAuth Buttons */
.btn-primary {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent-hover));
  color: #04201d;
  border: none;
  border-radius: 10px;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 4px 16px var(--accent-glow);
  transition: all 0.25s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-top: 8px;
}
.btn-primary:hover {
  filter: brightness(1.1);
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.divider {
  display: flex;
  align-items: center;
  margin: 20px 0;
  color: var(--text-muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.divider::before, .divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.08);
}
.divider span {
  padding: 0 12px;
}

.btn-secondary {
  width: 100%;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  padding: 11px;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
}
.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.1);
  border-color: rgba(255, 255, 255, 0.25);
}

.btn-guest {
  width: 100%;
  background: transparent;
  border: 1px dashed rgba(255, 255, 255, 0.18);
  border-radius: 10px;
  padding: 10px;
  color: var(--text-dim);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-guest:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(0, 191, 165, 0.05);
}

/* Alert Banner */
.alert-box {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  margin-bottom: 16px;
  display: none;
  align-items: center;
  gap: 8px;
}
.alert-box.error {
  display: flex;
  background: rgba(255, 82, 82, 0.15);
  border: 1px solid var(--danger);
  color: #ff8a80;
}
.alert-box.success {
  display: flex;
  background: rgba(105, 240, 174, 0.15);
  border: 1px solid var(--success);
  color: var(--success);
}

/* Footer links */
.card-footer {
  text-align: center;
  margin-top: 18px;
  font-size: 12px;
  color: var(--text-dim);
}
.card-footer a {
  color: var(--accent);
  text-decoration: none;
  font-weight: 600;
}
.card-footer a:hover {
  text-decoration: underline;
}

/* Spinner */
.spinner {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(0, 0, 0, 0.2);
  border-top-color: #04201d;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="bg-glow glow-1"></div>
<div class="bg-glow glow-2"></div>
<div class="bg-glow glow-3"></div>

<div class="auth-card">
  <!-- Brand -->
  <div class="brand">
    <div class="brand-logo">🐟</div>
    <h1>AquaFarm Command</h1>
    <p id="subTitle">Enter your credentials to access telemetry</p>
  </div>

  <!-- Tabs Switcher -->
  <div class="tabs">
    <button class="tab-btn active" id="tabSignIn">Sign In</button>
    <button class="tab-btn" id="tabSignUp">Create Account</button>
  </div>

  <!-- Alert Box -->
  <div class="alert-box" id="alertBox"></div>

  <!-- Sign In Form -->
  <form id="signInForm">
    <div class="form-group">
      <label for="loginEmail">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">✉️</span>
        <input type="email" id="loginEmail" required placeholder="operator@aquafarm.io" autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <div style="display:flex;justify-content:space-between;margin-bottom:6px">
        <label for="loginPassword" style="margin-bottom:0">Password</label>
        <a href="#" id="forgotPwdLink" style="font-size:11px;color:var(--accent);text-decoration:none">Forgot?</a>
      </div>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="loginPassword" required placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="pwd-toggle" id="toggleLoginPwd">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="btnSignInSubmit">
      <span>Sign In to Dashboard</span>
      <div class="spinner" id="loginSpinner"></div>
    </button>
  </form>

  <!-- Sign Up Form (hidden by default) -->
  <form id="signUpForm" style="display:none">
    <div class="form-group">
      <label for="signupName">Full Name</label>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input type="text" id="signupName" required placeholder="Dr. Sarah Chen">
      </div>
    </div>
    <div class="form-group">
      <label for="signupEmail">Email Address</label>
      <div class="input-wrap">
        <span class="input-icon">✉️</span>
        <input type="email" id="signupEmail" required placeholder="sarah.chen@aquafarm.io" autocomplete="email">
      </div>
    </div>
    <div class="form-group">
      <label for="signupRole">Role</label>
      <div class="input-wrap">
        <span class="input-icon">🏷️</span>
        <select id="signupRole" style="padding-left:38px">
          <option value="Operator">Farm Operator</option>
          <option value="Biologist">Aquaculture Biologist</option>
          <option value="Manager">Operations Manager</option>
          <option value="Admin">System Administrator</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label for="signupPassword">Password</label>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input type="password" id="signupPassword" required minlength="6" placeholder="Min. 6 characters" autocomplete="new-password">
        <button type="button" class="pwd-toggle" id="toggleSignupPwd">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn-primary" id="btnSignUpSubmit">
      <span>Create Farm Account</span>
      <div class="spinner" id="signupSpinner"></div>
    </button>
  </form>

  <div class="divider"><span>Or continue with</span></div>

  <!-- Google Auth -->
  <button type="button" class="btn-secondary" id="btnGoogleAuth">
    <svg width="18" height="18" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
    </svg>
    <span>Sign in with Google</span>
  </button>

  <!-- Guest / Demo Access -->
  <button type="button" class="btn-guest" id="btnGuestAccess">
    ⚡ Guest Mode / Demo Access
  </button>

  <div class="card-footer">
    <span id="footerPrompt">Don't have an account? </span>
    <a href="#" id="footerAction">Create one</a>
  </div>
</div>

<script type="module">
import { firebaseService } from './firebase-service.js';

// Elements
const tabSignIn = document.getElementById('tabSignIn');
const tabSignUp = document.getElementById('tabSignUp');
const signInForm = document.getElementById('signInForm');
const signUpForm = document.getElementById('signUpForm');
const alertBox = document.getElementById('alertBox');
const subTitle = document.getElementById('subTitle');
const footerPrompt = document.getElementById('footerPrompt');
const footerAction = document.getElementById('footerAction');

// Buttons
const btnSignInSubmit = document.getElementById('btnSignInSubmit');
const btnSignUpSubmit = document.getElementById('btnSignUpSubmit');
const btnGoogleAuth = document.getElementById('btnGoogleAuth');
const btnGuestAccess = document.getElementById('btnGuestAccess');
const forgotPwdLink = document.getElementById('forgotPwdLink');

// Spinners
const loginSpinner = document.getElementById('loginSpinner');
const signupSpinner = document.getElementById('signupSpinner');

// Toggle password visibility
document.getElementById('toggleLoginPwd').addEventListener('click', () => {
  const inp = document.getElementById('loginPassword');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});
document.getElementById('toggleSignupPwd').addEventListener('click', () => {
  const inp = document.getElementById('signupPassword');
  inp.type = inp.type === 'password' ? 'text' : 'password';
});

function showAlert(msg, isSuccess = false) {
  alertBox.className = 'alert-box ' + (isSuccess ? 'success' : 'error');
  alertBox.textContent = msg;
}
function clearAlert() {
  alertBox.style.display = 'none';
  alertBox.textContent = '';
}

// Switch between Sign In and Sign Up tabs
function switchToSignIn() {
  clearAlert();
  tabSignIn.classList.add('active');
  tabSignUp.classList.remove('active');
  signInForm.style.display = 'block';
  signUpForm.style.display = 'none';
  subTitle.textContent = 'Enter your credentials to access telemetry';
  footerPrompt.textContent = "Don't have an account? ";
  footerAction.textContent = "Create one";
}

function switchToSignUp() {
  clearAlert();
  tabSignUp.classList.add('active');
  tabSignIn.classList.remove('active');
  signUpForm.style.display = 'block';
  signInForm.style.display = 'none';
  subTitle.textContent = 'Register an operator account for AquaFarm';
  footerPrompt.textContent = "Already have an account? ";
  footerAction.textContent = "Sign in";
}

tabSignIn.addEventListener('click', switchToSignIn);
tabSignUp.addEventListener('click', switchToSignUp);
footerAction.addEventListener('click', (e) => {
  e.preventDefault();
  if (tabSignIn.classList.contains('active')) switchToSignUp();
  else switchToSignIn();
});

// Initialize Firebase Auth
firebaseService.init();

// Check if user is already signed in
firebaseService.callbacks.onAuthChange = (user) => {
  if (user && !user.isAnonymous) {
    showAlert(`Welcome back, ${user.displayName || user.email}! Redirecting...`, true);
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 1200);
  }
};

// 1. Email/Password Sign In
signInForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert();
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  btnSignInSubmit.disabled = true;
  loginSpinner.style.display = 'inline-block';

  try {
    const user = await firebaseService.signIn(email, password);
    showAlert(`Signed in successfully as ${user.displayName || user.email}! Loading dashboard...`, true);
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  } catch (err) {
    let msg = err.message;
    if (err.code === 'auth/invalid-credential' || err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password') {
      msg = 'Invalid email or password. Please try again.';
    } else if (err.code === 'auth/too-many-requests') {
      msg = 'Access temporarily disabled due to too many failed attempts. Try again later.';
    }
    showAlert(msg, false);
  } finally {
    btnSignInSubmit.disabled = false;
    loginSpinner.style.display = 'none';
  }
});

// 2. Email/Password Sign Up
signUpForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  clearAlert();
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;

  btnSignUpSubmit.disabled = true;
  signupSpinner.style.display = 'inline-block';

  try {
    const user = await firebaseService.signUp(email, password, name);
    showAlert(`Account created successfully for ${name}! Redirecting to dashboard...`, true);
    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
  } catch (err) {
    let msg = err.message;
    if (err.code === 'auth/email-already-in-use') {
      msg = 'This email address is already registered. Please sign in instead.';
    } else if (err.code === 'auth/weak-password') {
      msg = 'Password is too weak. Please choose at least 6 characters.';
    }
    showAlert(msg, false);
  } finally {
    btnSignUpSubmit.disabled = false;
    signupSpinner.style.display = 'none';
  }
});

// 3. Google Sign-In
btnGoogleAuth.addEventListener('click', async () => {
  clearAlert();
  try {
    const user = await firebaseService.signInWithGoogle();
    showAlert(`Signed in via Google as ${user.displayName || user.email}! Redirecting...`, true);
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  } catch (err) {
    if (err.code !== 'auth/popup-closed-by-user') {
      showAlert(err.message, false);
    }
  }
});

// 4. Guest / Demo Mode
btnGuestAccess.addEventListener('click', async () => {
  try {
    await firebaseService.signInGuest();
    window.location.href = 'index.html';
  } catch {
    window.location.href = 'index.html';
  }
});

// 5. Forgot Password
forgotPwdLink.addEventListener('click', async (e) => {
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) {
    showAlert('Please enter your email address in the field above first.', false);
    return;
  }
  showAlert(`Password reset request sent for ${email}. Check your inbox!`, true);
});
</script>

</body>
</html>
